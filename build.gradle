plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = "${project.version}+${project.minecraft_version_base}"

loom {
	mods {
		'harvestleveltooltip' {
			sourceSet sourceSets.main
		}
	}
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modCompileOnly fabricApi.module('fabric-item-api-v1', project.fapi_version)
	modCompileOnly fabricApi.module('fabric-lifecycle-events-v1', project.fapi_version)
	modCompileOnly fabricApi.module('fabric-networking-api-v1', project.fapi_version)
	modCompileOnly fabricApi.module('fabric-resource-loader-v0', project.fapi_version)

	modRuntimeOnly "net.fabricmc.fabric-api:fabric-api:${project.fapi_version}"
	modRuntimeOnly 'maven.modrinth:oxytools:1.1.1'
}

processResources {
	def version = project.version
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property 'projectName', projectName

	from('LICENSE.md') {
		rename { "${it}_$projectName" }
	}
}
